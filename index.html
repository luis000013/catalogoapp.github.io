<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CatálogoYa · Tu tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{ --bg:#fafafa; --surface:#ffffff; --surface2:#f3f3f1; --border:rgba(20,20,18,.08); --border2:rgba(20,20,18,.05);
 --text:#1a1a18; --text2:#6b6b66; --primary:#1a1a18; --primary-text:#ffffff;
 --ok:#22c55e; --ok-bg:rgba(34,197,94,.10); --amber:#f59e0b; --amber-bg:rgba(245,158,11,.12);
 --blue:#3b82f6; --blue-bg:rgba(59,130,246,.10); --red:#ef4444; --red-bg:rgba(239,68,68,.10);
 --wa:#25D366; --shadow-sm:0 1px 2px 0 rgba(0,0,0,.04); --shadow:0 4px 24px -8px rgba(0,0,0,.08);}
html[data-theme="dark"]{ --bg:#0f0f0d; --surface:#1a1a18; --surface2:#252522; --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.04);
 --text:#fafafa; --text2:#a3a3a0; --primary:#fafafa; --primary-text:#0f0f0d;
 --ok:#4ade80; --ok-bg:rgba(74,222,128,.15); --amber:#fbbf24; --amber-bg:rgba(251,191,36,.15);
 --blue:#60a5fa; --blue-bg:rgba(96,165,250,.15); --red:#f87171; --red-bg:rgba(248,113,113,.15);
 --wa:#25D366; --shadow-sm:0 1px 2px 0 rgba(0,0,0,.2); --shadow:0 4px 24px -8px rgba(0,0,0,.5);}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.btn{padding:12px 20px;border-radius:14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;gap:8px}
.btn:active{transform:scale(.97)} .btn svg{flex:none}
.btn-primary{background:var(--primary);color:var(--primary-text);box-shadow:var(--shadow-sm)}
.btn-primary:hover{opacity:.92}
.btn-outline{border:1.5px solid var(--border);background:var(--surface);color:var(--text)}
.btn-outline:hover{border-color:var(--text2)}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 4px 14px -4px rgba(37,211,102,.4)}
.btn-wa:hover{opacity:.95}
.btn[disabled]{opacity:.4;pointer-events:none} .btn+.btn{margin-left:10px}
.circle-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none;transition:border-color .15s}
.circle-btn:hover{border-color:var(--text2)}
.sq-btn{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
.pill{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;flex:none;text-transform:uppercase}
.pill.ok,.pill.entregado,.pill.pagado{background:var(--ok-bg);color:var(--ok)}
.pill.low,.pill.pendiente,.pill.parcial{background:var(--amber-bg);color:var(--amber)}
.pill.info,.pill.enviado{background:var(--blue-bg);color:var(--blue)}
.pill.out,.pill.cancelado,.pill.vencido{background:var(--red-bg);color:var(--red)}
.inp{width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:12px 16px;color:var(--text);outline:none;font-size:14px;transition:all .15s}
.inp:focus{border-color:var(--primary);background:var(--surface)}
.searchwrap{position:relative;flex:1;min-width:180px;max-width:340px;margin-right:10px}
.searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text2)}
.searchwrap .inp{padding-left:40px}
.field{margin-bottom:16px} .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;grid-gap:14px;gap:14px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.chips{display:flex;overflow-x:auto;padding:4px 2px;scrollbar-width:none;gap:8px} .chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 18px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:var(--text);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip.on{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.shead{display:flex;align-items:flex-start;padding:24px 0 12px;gap:16px}
.logo{width:60px;height:60px;flex:none;border-radius:18px;background:var(--primary);color:var(--primary-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;overflow:hidden;box-shadow:var(--shadow)}
.logo img{width:100%;height:100%;object-fit:cover}
.shead h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.meta{display:flex;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px;color:var(--text2);gap:6px 12px}
.live{display:inline-flex;align-items:center;background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12px;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}55%{opacity:.35}}
.bio{margin-top:12px;font-size:14px;line-height:1.6;color:var(--text);white-space:pre-line;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:16px;gap:16px;padding:16px 0 110px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);grid-gap:20px;gap:20px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.pcard{background:var(--surface);border:1px solid var(--border2);border-radius:20px;overflow:hidden;text-align:left;transition:all .25s;animation:pop .4s both;box-shadow:var(--shadow-sm)}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tile{position:relative;padding-bottom:100%;overflow:hidden;background-size:cover;background-position:center}
.tile .tic{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;transition:transform .4s}
.pcard:hover .tic{transform:scale(1.08)}
.tile.sold{filter:grayscale(1) opacity(.55)}
.tb{position:absolute;top:12px;left:12px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;backdrop-filter:blur(8px)}
.tb.low{background:var(--amber-bg);color:var(--amber)} .tb.out{background:var(--red-bg);color:var(--red)}
.tb.star{left:auto;top:auto;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fbbf24}
.pinfo{padding:14px 16px 16px}
.pcat{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);font-weight:700}
.pname{font-weight:600;font-size:16px;margin:5px 0 7px;line-height:1.3}
.pprice{font-weight:800;font-size:17px}
.row{display:flex;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:16px;margin-bottom:12px;transition:box-shadow .15s;gap:12px}
.row:hover{box-shadow:var(--shadow)}
.row-main{flex:1;min-width:150px} .row-main b{font-size:15px;font-weight:600} .row-main small{display:block;color:var(--text2);font-size:12px;margin-top:3px}
.sw{width:52px;height:52px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text2);flex:none;transition:all .15s}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.stepper{display:flex;align-items:center;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:2px;gap:2px}
.stepper button{width:30px;height:30px;border-radius:9px;font-weight:800;font-size:15px;transition:background .15s}
.stepper button:hover{background:var(--border)}
.stepper span{width:34px;text-align:center;font-weight:700;font-size:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px;gap:12px;margin:16px 0}
@media(min-width:860px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:20px;box-shadow:var(--shadow-sm)}
.kpi b{display:block;font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.kpi b.amber{color:var(--amber)} .kpi b.ok{color:var(--ok)} .kpi b.red{color:var(--red)}
.kpi span{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;flex-wrap:wrap;margin-bottom:20px}
.opt{display:block;border:1.5px solid var(--border);border-radius:16px;background:var(--surface);padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:all .15s}
.opt.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.opt.off{opacity:.45;cursor:not-allowed}
.opt b{font-size:14px;font-weight:600} .opt small{display:block;color:var(--text2);font-size:13px;margin-top:3px}
.opt .pr{float:right;font-weight:700}
.bk{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;backdrop-filter:blur(4px)}
.bk.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:50;background:var(--surface);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .4s cubic-bezier(.32,.72,.28,1);display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer .hd{padding:20px 22px 14px;border-bottom:1px solid var(--border2)}
.drawer .bd{flex:1;overflow-y:auto;padding:18px 22px}
.drawer .ft{padding:16px 22px 20px;border-top:1px solid var(--border2)}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--border2);border-radius:22px;padding:26px;width:min(430px,92%);max-height:86vh;overflow-y:auto;box-shadow:var(--shadow);z-index:60}
.cline{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border2);gap:12px}
.meter{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#86efac);transition:width .4s}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
.bottombar .in{max-width:1080px;margin:0 auto;width:100%;display:flex;align-items:center}
.bottombar .cart{margin-left:auto;border-radius:999px;padding:13px 22px}
.bottombar .cart .bdg{background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:2px 9px;margin-left:10px;font-size:12px;font-weight:800}
.sumbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:14px 16px calc(14px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
.sumbar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.sumbar .tot{flex:1;min-width:150px;font-size:13px;color:var(--text2)}
.sumbar .tot b{display:block;font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.01em}
.conf-card{background:var(--surface);border:1px solid var(--border2);border-radius:22px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.bankline{display:flex;align-items:center;flex-wrap:wrap;background:var(--surface2);border:1.5px dashed var(--border);border-radius:14px;padding:12px 16px;margin-bottom:10px;font-size:13px;gap:8px}
.bankline b{font-weight:700} .bankline button{margin-left:auto;font-size:12px;font-weight:800;color:var(--blue)}
.msgbox{background:var(--ok-bg);border:1.5px dashed var(--ok);border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.6;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text)}
.steps{display:flex;align-items:center;margin:20px 0;gap:8px}
.stepdot{width:32px;height:32px;border-radius:50%;background:var(--surface2);color:var(--text2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.stepdot.on{background:var(--primary);color:var(--primary-text)} .stepdot.done{background:var(--ok);color:#fff}
.steplab{font-weight:600;font-size:13px;margin-right:18px}
table.fin{width:100%;border-collapse:collapse;font-size:14px}
table.fin th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);padding:10px 12px;border-bottom:2px solid var(--border);font-weight:700}
table.fin td{padding:14px 12px;border-bottom:1px solid var(--border2)}
.bars{display:flex;align-items:flex-end;height:80px;margin:12px 0;gap:8px}
.bars i{flex:1;background:linear-gradient(180deg,var(--ok),#86efac);border-radius:8px 8px 0 0;min-height:4px;transition:height .4s}
.stars{color:#fbbf24;font-size:13px;letter-spacing:1px}
.authcard{max-width:440px;margin:8vh auto;background:var(--surface);border:1px solid var(--border2);border-radius:26px;padding:32px;box-shadow:var(--shadow)}
.authcard h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.imgprev{width:90px;height:90px;border-radius:16px;border:1.5px dashed var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text2);flex:none}
.imgprev img{width:100%;height:100%;object-fit:cover}
#toasts{position:fixed;left:16px;bottom:86px;z-index:90;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--primary);color:var(--primary-text);padding:14px 18px;border-radius:14px;font-size:13px;font-weight:600;max-width:340px;animation:tin .35s both;display:flex;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);gap:8px}
.toast.good{border-left:4px solid var(--wa)} .toast.warn{border-left:4px solid var(--amber)}
.toast button{margin-left:auto;font-weight:800;font-size:12px;opacity:.85}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
.foot{text-align:center;padding:12px 0 110px;font-size:12px;color:var(--text2)}
#printArea{background:#fff;color:#111}
#printArea h2{font-size:20px;margin-bottom:4px}
#printArea table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
#printArea td,#printArea th{padding:5px 4px;border-bottom:1px solid #ddd;text-align:left}

/* ─── MÓDULOS REDISEÑADOS ─── */
.admin-header{background:var(--surface);border:1px solid var(--border2);border-radius:22px;padding:22px;margin:20px 0 24px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.admin-header .logo{margin:0}
.admin-header .row-main b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.admin-header .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.product-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-sm);transition:all .2s}
.product-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.product-card .tile{padding-bottom:60%;border-radius:0}
.product-card-body{padding:18px 20px 20px}
.product-card-title{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.product-card-meta{font-size:13px;color:var(--text2);margin-bottom:12px}
.product-card-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.product-card-stat{background:var(--surface2);border-radius:12px;padding:10px 12px;text-align:center}
.product-card-stat b{display:block;font-size:16px;font-weight:800}
.product-card-stat span{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.product-card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.publish-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.publish-grid{grid-template-columns:1fr}}
.publish-section{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:22px;box-shadow:var(--shadow-sm)}
.publish-section h3{font-size:15px;font-weight:700;margin-bottom:14px;letter-spacing:-.01em}
.publish-preview{border-radius:16px;overflow:hidden;margin-bottom:14px;aspect-ratio:1}
.publish-preview .tile{padding-bottom:100%}

.finance-section{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow-sm)}

.customer-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow-sm);display:flex;gap:14px;align-items:flex-start}
.customer-card .sw{width:48px;height:48px;font-size:18px;font-weight:800;color:var(--text);background:var(--surface2);border:1px solid var(--border)}
.customer-card .row-main{flex:1}
.customer-card .row-main b{font-size:16px}
.customer-card textarea{margin-top:10px;width:100%;min-height:50px;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:10px 12px;font-size:13px;resize:vertical;transition:all .15s}
.customer-card textarea:focus{border-color:var(--primary);background:var(--surface);outline:none}
.customer-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;padding:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="v-auth" class="wrap" style="display:none">
  <div class="authcard">
    <div style="display:flex;align-items:center;margin-bottom:8px">
      <div class="logo" style="width:48px;height:48px;font-size:16px">CY</div>
      <div><h1>CatálogoYa</h1><p style="font-size:13px;color:var(--text2);margin-top:4px">Tu tienda en línea con cierre por WhatsApp</p></div>
    </div>
    <div class="chips" style="margin:16px 0">
      <button class="chip on" id="authTabLogin" onclick="authTab('login')">Iniciar sesión</button>
      <button class="chip" id="authTabReg" onclick="authTab('reg')">Crear tienda</button>
    </div>
    <div id="authLogin">
      <div class="field"><label>Email</label><input class="inp" id="liEmail" type="email" placeholder="tu@tienda.com"></div>
      <div class="field"><label>Contraseña</label><input class="inp" id="liPass" type="password" placeholder="••••••"></div>
      <p id="liErr" style="color:var(--red);font-size:13px;font-weight:600;margin-bottom:8px"></p>
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Entrar a mi panel</button>
      <button class="btn btn-outline" style="width:100%;margin:12px 0 0" onclick="loginDemo()">✨ Entrar a la tienda demo</button>
    </div>
    <div id="authReg" style="display:none">
      <div class="field"><label>Nombre de la tienda *</label><input class="inp" id="rgName" placeholder="Alma Bazar" oninput="autoHandle(this.value)"></div>
      <div class="field"><label>@handle</label><input class="inp" id="rgHandle" placeholder="alma-bazar"></div>
      <div class="field"><label>Email *</label><input class="inp" id="rgEmail" type="email" placeholder="tu@tienda.com"></div>
      <div class="field"><label>Contraseña * (mín. 6)</label><input class="inp" id="rgPass" type="password"></div>
      <p id="rgErr" style="color:var(--red);font-size:13px;font-weight:600;margin-bottom:8px"></p>
      <button class="btn btn-primary" style="width:100%" onclick="doRegister()">Crear mi tienda 🚀</button>
    </div>
    <p style="font-size:11.5px;color:var(--text2);margin-top:16px;text-align:center">Tus datos se guardan en tu cuenta de CatálogoYa (Supabase).</p>
  </div>
</div>

<!-- TIENDA -->
<div id="v-tienda" class="wrap" style="display:none">
  <header class="shead">
    <div class="logo" id="storeLogo">AB</div>
    <div style="flex:1">
      <h1 id="storeName"></h1>
      <div class="meta">
        <span class="live"><span class="dot"></span>Stock en vivo</span>
        <span id="metaCount"></span>
        <span id="storeHandle"></span>
        <span id="reorderSlot"></span>
      </div>
      <div class="bio" id="storeBio"></div>
    </div>
    <button class="circle-btn" id="themeBtn" onclick="toggleTheme()" title="Cambiar tema"></button>
  </header>
  <div style="display:flex;flex-wrap:wrap;align-items:center;padding:8px 0 4px">

function persist(){if(DB){STORES[DB.id]=DB;persistStores();}}
var cart=(function(){var r=LSget('cy2-cart');if(r){try{var c=JSON.parse(r);if(c&&c.length!==undefined)return c;}catch(e){}}return [];})();
function persistCart(){LSset('cy2-cart',JSON.stringify(cart));}
var state={view:'auth',cat:'Todo',subcat:'Todo',q:'',sheet:null,sel:{},qty:1,tab:'pedidos',co:null,finPeriod:30,pf:{status:'todos',q:''}};
function storePhone(){return (DB&&DB.phone)||'18095550143';}
function storeUrl(){return 'https://'+((DB&&DB.handle)||'alma.bazar')+'.catya.do';}

/* helpers */
function $(s){return document.querySelector(s);}
function esc(s){s=(s===null||s===undefined)?'':String(s);return s.replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return 'RD$ '+new Intl.NumberFormat('es-DO',{maximumFractionDigits:0}).format(Math.round(n));}
function uid(){return Math.random().toString(36).slice(2,9);}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function findP(id){if(!DB)return null;for(var i=0;i<DB.products.length;i++)if(DB.products[i].id===id)return DB.products[i];return null;}
function findO(id){for(var i=0;i<DB.orders.length;i++)if(DB.orders[i].id===id)return DB.orders[i];return null;}
function zoneOf(pv){var P=[['Distrito Nacional','ZONA_SD'],['Santo Domingo Este','ZONA_SD'],['Santo Domingo Oeste','ZONA_SD'],['Santo Domingo Norte','ZONA_SD'],['Santiago','ZONA_CIBAO'],['La Vega','ZONA_CIBAO'],['Puerto Plata','ZONA_CIBAO'],['Punta Cana','ZONA_ESTE'],['La Romana','ZONA_ESTE'],['San Pedro de Macorís','ZONA_ESTE'],['San Cristóbal','ZONA_SUR'],['Barahona','ZONA_SUR']];for(var i=0;i<P.length;i++)if(P[i][0]===pv)return P[i][1];return '';}
function fDate(iso){return new Date(iso).toLocaleDateString('es-DO',{day:'2-digit',month:'short'});}
function fDT(iso){var d=new Date(iso);return d.toLocaleDateString('es-DO',{day:'2-digit',month:'2-digit',year:'numeric'})+' · '+d.toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'});}
function stars(r){var f=Math.round(r);return '★★★★★'.slice(0,f)+'☆☆☆☆☆'.slice(0,5-f);}
function ratingOf(pid){var rs=DB.reviews.filter(function(r){return r.pid===pid;});if(!rs.length)return null;var s=0;rs.forEach(function(r){s+=r.rating;});return s/rs.length;}
function payLabel(id){for(var i=0;i<DB.settings.payments.length;i++)if(DB.settings.payments[i].id===id)return DB.settings.payments[i];
 if(id==='credito')return {bank:'A crédito (30 días)',type:'credit'};return {bank:id};}
function shipLabel(id){for(var i=0;i<DB.settings.shipping.length;i++)if(DB.settings.shipping[i].id===id)return DB.settings.shipping[i];return {label:id,price:0};}
function paidOf(oid){var s=0;DB.payments.forEach(function(p){if(p.order_id===oid)s+=p.amount;});return s;}
function balanceOf(o){return Math.max(0,o.total-paidOf(o.id));}
function fileToDataURL(file,max,square,cb){var fr=new FileReader();
 fr.onload=function(){var img=new Image();
  img.onload=function(){var c=document.createElement('canvas'),w=img.width,h=img.height,ctx;
   if(square){var s=Math.min(w,h),sx=(w-s)/2,sy=(h-s)/2;c.width=max;c.height=max;ctx=c.getContext('2d');ctx.drawImage(img,sx,sy,s,s,0,0,max,max);}
   else{var r=Math.min(1,max/Math.max(w,h));c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);}
   cb(c.toDataURL('image/jpeg',0.82));};
  img.src=fr.result;};
 fr.readAsDataURL(file);}
function dataURLtoFile(dataurl,filename){var arr=dataurl.split(','),mime=(arr[0].match(/:(.*?);/)||[,'image/jpeg'])[1],bstr=atob(arr[1]),n=bstr.length,u8=new Uint8Array(n);
 while(n--){u8[n]=bstr.charCodeAt(n);}return new File([u8],filename,{type:mime});}
function downloadData(d,name){if(!d)return;var a=document.createElement('a');a.href=d;a.download=name||'imagen.jpg';document.body.appendChild(a);a.click();a.remove();}
function shareFiles(text,images){var files=[];(images||[]).forEach(function(d,i){if(d){try{files.push(dataURLtoFile(d,'img-'+(i+1)+'.jpg'));}catch(e){}}});
 try{
  if(files.length&&navigator.canShare&&navigator.canShare({files:files})){navigator.share({files:files,text:text,title:'CatálogoYa'}).catch(function(){});return true;}
  if(!files.length&&navigator.share){navigator.share({text:text,title:'CatálogoYa'}).catch(function(){});return true;}
 }catch(e){}
 return false;}
function openWaText(text,phone){window.open('https://wa.me/'+(phone||storePhone())+'?text='+encodeURIComponent(text),'_blank');}
function copyText(t){function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast('Copiado ✔','good');}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Copiado ✔','good');},fb);}else fb();}
function toast(msg,tone,actLabel,cb){var t=document.createElement('div');t.className='toast '+(tone||'');t.textContent=msg;
 if(actLabel){var b=document.createElement('button');b.textContent=actLabel;b.onclick=function(){t.remove();if(cb)cb();};t.appendChild(b);}
 $('#toasts').appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(function(){t.remove();},300);},3400);}
var confirmCb=null;
function askConfirm(msg,cb){confirmCb=cb;openModal('<h3 style="font-size:18px;font-weight:700;margin-bottom:10px">Confirmar</h3><p style="font-size:14px;line-height:1.5;margin-bottom:18px;color:var(--text2)">'+esc(msg)+'</p><div><button class="btn btn-primary" onclick="doConfirm()">Sí, continuar</button><button class="btn btn-outline" onclick="closeModal()">Cancelar</button></div>');}
function doConfirm(){var cb=confirmCb;closeModal();if(cb)cb();}
function openModal(html){$('#modalSlot').innerHTML='<div class="modal" style="pointer-events:auto">'+html+'</div>';$('#modalBk').className='bk show';}
function closeModal(){confirmCb=null;$('#modalSlot').innerHTML='';$('#modalBk').className='bk';}

/* ═════════ AUTH ═════════ */

 $('#authLogin').style.display=t==='login'?'block':'none';$('#authReg').style.display=t==='reg'?'block':'none';}

 var dup=false;Object.keys(STORES).forEach(function(k){if(STORES[k].email===e)dup=true;});

 var s={id:uid(),name:n,handle:h||slug(n),email:e,passHash:hpass(p),bio:'',logo:'',phone:'',seq:{order:0,receipt:0},settings:DEFSettings(),

 STORES[s.id]=s;persistStores();setSession(s.id);enterApp();
 toast('🎉 Tienda "'+n+'" creada. Agrega tu primer producto.','good');setTimeout(function(){openAdmin();state.tab='inventario';renderAdmin();openProd();},600);}

/* ═════════ CARRITO ═════════ */
function vkey(v){var ks=Object.keys(v).sort(),out=[];ks.forEach(function(k){out.push(k+'='+v[k]);});return out.join('|');}
function addToCart(pid,variant,qty){var p=findP(pid);if(!p||p.stock<=0)return;var key=vkey(variant),found=null;
 cart.forEach(function(l){if(l.pid===pid&&l.vkey===key)found=l;});
 if(found)found.qty=Math.min(p.stock,found.qty+qty);else cart.push({pid:pid,variant:variant,vkey:key,qty:Math.min(p.stock,qty)});
 persistCart();renderCartBadge();toast('Agregado: '+p.name,'good');openCart();}
function cartCalc(){var lines=[],sub=0;cart.forEach(function(l){var p=findP(l.pid);if(!p)return;var lt=p.price*l.qty;sub+=lt;lines.push({l:l,p:p,lt:lt});});
 var disc=0;if(sub>=DB.settings.promo.min)disc=Math.round(sub*DB.settings.promo.percent/100);return {lines:lines,subtotal:sub,discount:disc,net:sub-disc};}
function renderCartBadge(){var n=0;cart.forEach(function(l){n+=l.qty;});var t='RD$ 0';
 if(DB){t=fmt(cartCalc().net);}$('#fabCart').innerHTML=ic('cart',18)+'<span style="margin-left:8px">'+t+'</span><span class="bdg">'+n+'</span>';}
function openCart(){$('#cartBk').className='bk show';$('#cartDr').className='drawer show';renderCart();}
function closeCart(){$('#cartBk').className='bk';$('#cartDr').className='drawer';}
function availabilityMessage(){var c=cartCalc();var L=[];
 L.push('*Consulta de disponibilidad — '+DB.name+'*');
 L.push('¡Hola! Me interesan los artículos de las fotos. ¿Tienen disponibilidad para entrega o envío inmediato?');
 L.push('');
 c.lines.forEach(function(x){var v=Object.keys(x.l.variant).map(function(k){return x.l.variant[k];}).join(' · ');
  L.push('• '+x.p.name+(v?' · '+v:'')+' — '+fmt(x.p.price)+(x.p.stock<=0?' — ⛔ Agotado':''));});
 L.push('');
 L.push('🧺 Total estimado: *'+fmt(c.net)+'*');
 L.push('Opciones:');
 L.push('Completa la compra aquí → '+storeUrl()+'?t='+DB.handle);
 L.push('¡Quedo a la espera de su confirmación! Muchas gracias.');
 return L.join('\n');}
function confirmAvailability(){if(!cart.length)return toast('Tu carrito está vacío','warn');
 var c=cartCalc(),msg=availabilityMessage();
 var imgs=c.lines.map(function(x){return x.p.image;});
 if(shareFiles(msg,imgs)){toast('Abriendo WhatsApp con las fotos del carrito…','good');}
 else{openWaText(msg);toast(imgs.some(function(i){return i;})?'Tu dispositivo no adjunta fotos solo: se abrió el chat con el detalle para que las adjuntes':'Chat abierto con la consulta','warn');}}
function renderCart(){var c=cartCalc();
 $('#cartHd').innerHTML='<div style="display:flex;align-items:center"><b style="font-size:18px;font-weight:700;flex:1">Tu carrito</b><button class="icon-btn" onclick="closeCart()">'+ic('x',18)+'</button></div>';
 if(!c.lines.length){$('#cartBd').innerHTML='<p style="text-align:center;color:var(--text2);padding:50px 0">Tu carrito está vacío.</p>';$('#cartFt').innerHTML='';return;}
 var rem=DB.settings.free_threshold-c.subtotal;
 $('#cartBd').innerHTML='<div style="font-size:13px;font-weight:700;color:'+(rem>0?'var(--amber)':'var(--ok)')+'">'+(rem>0?'🚚 Agrega '+fmt(rem)+' más para envío gratis en Santo Domingo':'🎉 ¡Envío gratis en Santo Domingo!')+'</div><div class="meter"><i style="width:'+Math.min(100,Math.round(c.subtotal/DB.settings.free_threshold*100))+'%"></i></div>'+
 c.lines.map(function(x,i){return '<div class="cline">'+swHTML(x.p)+'<div class="row-main" style="min-width:100px"><b style="font-size:14px">'+esc(x.p.name)+'</b><small>'+esc(Object.keys(x.l.variant).map(function(k){return x.l.variant[k];}).join(' · '))+' · '+fmt(x.p.price)+'</small></div>'+
  '<div class="stepper"><button onclick="setQty('+i+','+(x.l.qty-1)+')">−</button><span>'+x.l.qty+'</span><button onclick="setQty('+i+','+(x.l.qty+1)+')">+</button></div>'+
  '<b style="min-width:66px;text-align:right;font-size:14px">'+fmt(x.lt)+'</b><button class="icon-btn" onclick="removeLine('+i+')">'+ic('trash',16)+'</button></div>';}).join('');
 var dsc=c.discount>0?'<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ok);font-weight:700;margin-top:8px"><span>Promo ('+DB.settings.promo.percent+'%)</span><span>−'+fmt(c.discount)+'</span></div>':'';
 $('#cartFt').innerHTML='<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text2)"><span>Subtotal</span><span>'+fmt(c.subtotal)+'</span></div>'+dsc+
  '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:8px 0 14px"><span>Total</span><span>'+fmt(c.net)+'</span></div>'+
  '<button class="btn btn-wa" style="width:100%;margin-bottom:10px" onclick="confirmAvailability()">'+icWa(17)+'Confirmar disponibilidad del pedido</button>'+
  '<button class="btn btn-primary" style="width:100%" onclick="openCheckout()">Continuar pedido →</button>';}
function setQty(i,q){if(q<=0){removeLine(i);return;}var p=findP(cart[i].pid);cart[i].qty=Math.min(p?p.stock:99,q);persistCart();renderCartBadge();renderCart();}
var lastRemoved=null;
function removeLine(i){lastRemoved={line:cart[i],i:i};cart.splice(i,1);persistCart();renderCartBadge();renderCart();
 toast('Artículo removido','warn','DESHACER',function(){cart.splice(lastRemoved.i,0,lastRemoved.line);persistCart();renderCartBadge();renderCart();});}

/* ═════════ CATÁLOGO ═════════ */
function cats(){var seen={},out=['Todo'];DB.products.forEach(function(p){if(!seen[p.cat]){seen[p.cat]=1;out.push(p.cat);}});return out;}
function renderStoreHead(){var ini=DB.name.slice(0,2).toUpperCase();
 $('#storeLogo').innerHTML=DB.logo?'<img src="'+DB.logo+'" alt="">':esc(ini);
 $('#adminLogo').innerHTML=DB.logo?'<img src="'+DB.logo+'" alt="">':esc(ini);
 $('#storeName').textContent=DB.name;$('#adminTitle').textContent='Panel · '+DB.name;
 $('#storeHandle').textContent='@'+DB.handle+(DB.phone?' · Santo Domingo, RD':'');
 $('#storeBio').textContent=DB.bio||'';$('#storeBio').style.display=DB.bio?'block':'none';}
function renderCatalog(){if(!DB)return;renderStoreHead();
 $('#chips').innerHTML=cats().map(function(c){return '<button class="chip '+(state.cat===c?'on':'')+'" onclick="setCat(\''+c+'\')">'+esc(c)+'</button>';}).join('');
 var subs=[];if(state.cat!=='Todo'){var seen={};DB.products.forEach(function(p){if(p.cat===state.cat&&p.subcat&&!seen[p.subcat]){seen[p.subcat]=1;subs.push(p.subcat);}});}
 $('#subchips').innerHTML=subs.length?'<button class="chip '+(state.subcat==='Todo'?'on':'')+'" onclick="state.subcat=\'Todo\';renderCatalog()">Todo</button>'+subs.map(function(s){return '<button class="chip '+(state.subcat===s?'on':'')+'" onclick="state.subcat=\''+esc(s)+'\';renderCatalog()">'+esc(s)+'</button>';}).join(''):'';
 var q=state.q.toLowerCase();
 var list=DB.products.filter(function(p){return (state.cat==='Todo'||p.cat===state.cat)&&(state.subcat==='Todo'||p.subcat===state.subcat)&&((p.name+(p.code||'')).toLowerCase().indexOf(q)!==-1);});
 var units=DB.products.reduce(function(a,p){return a+p.stock;},0);
 $('#metaCount').textContent=DB.products.length+' productos · '+units+' uds.';
 $('#reorderSlot').innerHTML=LSget('cy2-last')?'<button class="chip" style="border-color:var(--ok);color:var(--ok)" onclick="reorder()">↺ Repetir último pedido</button>':'';
 $('#grid').innerHTML=list.length?list.map(function(p,i){var sold=p.stock<=0,low=p.stock>0&&p.stock<=DB.settings.low_stock,r=ratingOf(p.id);
  return '<button class="pcard" style="animation-delay:'+(i*40)+'ms" onclick="openSheet(\''+p.id+'\')">'+
   tileOpen(p,sold?'sold':'')+
   (sold?'<span class="tb out">Agotado</span>':low?'<span class="tb low">Últimas '+p.stock+'</span>':'')+
   (r?'<span class="tb star">'+stars(r)+'</span>':'')+'</div>'+
   '<div class="pinfo"><span class="pcat">'+esc(p.cat)+(p.subcat?' · '+esc(p.subcat):'')+'</span><div class="pname">'+esc(p.name)+'</div><div class="pprice">'+fmt(p.price)+(p.code?' <span style="color:var(--text2);font-weight:600;font-size:12px">· '+esc(p.code)+'</span>':'')+'</div></div></button>';}).join('')
  :'<div style="grid-column:1/-1;text-align:center;padding:50px 0;color:var(--text2)">'+(DB.products.length?'Nada por aquí… prueba otra búsqueda.':'Aún no hay productos.<br><br><button class="btn btn-primary" onclick="openAdmin();state.tab=\'inventario\';renderAdmin();openProd()">'+ic('plus',16)+'Crear mi primer producto</button>')+'</div>';}
function setCat(c){state.cat=c;state.subcat='Todo';renderCatalog();}
function openSheet(pid){var p=findP(pid);if(!p)return;state.sheet=p;state.sel={};state.qty=1;
 if(p.sizes.length)state.sel['Talla']=p.sizes[0];if(p.colors.length)state.sel['Color']=p.colors[0].n;
 $('#sheetBk').className='bk show';$('#sheetDr').className='drawer show';renderSheet();}
function closeSheet(){$('#sheetBk').className='bk';$('#sheetDr').className='drawer';state.sheet=null;}
function renderSheet(){var p=state.sheet;if(!p)return;var sold=p.stock<=0;
 var wa='https://wa.me/'+storePhone()+'?text='+encodeURIComponent('Hola 👋 Vi *'+p.name+'*'+(p.code?' ('+p.code+')':'')+' a '+fmt(p.price)+' en tu catálogo. ¿Está disponible? '+storeUrl()+'/p/'+p.id);
 $('#sheetBd').innerHTML='<div style="display:flex;align-items:center;margin-bottom:12px"><b style="font-size:18px;font-weight:700;flex:1">'+esc(p.name)+'</b><button class="icon-btn" onclick="closeSheet()">'+ic('x',18)+'</button></div>'+

  '<p style="font-size:13px;color:var(--text2);margin:12px 0 6px">'+esc(p.cat)+(p.subcat?' · '+esc(p.subcat):'')+(p.code?' · Cód. '+esc(p.code):'')+'</p>'+
  '<p style="font-size:14px;color:var(--text2);margin-bottom:8px">'+esc(p.desc)+'</p><div class="pprice" style="margin-bottom:10px;font-size:20px">'+fmt(p.price)+'</div>'+
  (p.sizes.length?'<div class="field"><label>Talla</label><div class="chips">'+p.sizes.map(function(s){return '<button class="chip '+(state.sel['Talla']===s?'on':'')+'" onclick="state.sel[\'Talla\']=\''+s+'\';renderSheet()">'+s+'</button>';}).join('')+'</div></div>':'')+
  (p.colors.length?'<div class="field"><label>Color</label><div class="chips">'+p.colors.map(function(c){return '<button class="chip '+(state.sel['Color']===c.n?'on':'')+'" onclick="state.sel[\'Color\']=\''+esc(c.n)+'\';renderSheet()">'+esc(c.n)+'</button>';}).join('')+'</div></div>':'')+
  '<div class="field"><label>Cantidad</label><div class="stepper" style="display:inline-flex"><button onclick="state.qty=Math.max(1,state.qty-1);renderSheet()">−</button><span>'+state.qty+'</span><button onclick="state.qty=Math.min('+Math.max(1,p.stock)+',state.qty+1);renderSheet()">+</button></div> <span style="font-size:12px;color:var(--text2)">'+(sold?'sin stock':p.stock+' disponibles')+'</span></div>'+
  (sold?'<button class="btn btn-outline" disabled style="width:100%">Agotado — vuelve pronto</button>'
   :'<button class="btn btn-primary" style="width:100%" onclick="addToCart(\''+p.id+'\',state.sel,state.qty);closeSheet()">'+ic('cart',17)+'Agregar · '+fmt(p.price*state.qty)+'</button>'+
    '<a class="btn btn-wa" style="width:100%;margin-top:10px" href="'+wa+'" target="_blank" rel="noopener noreferrer">'+icWa(17)+'Preguntar por WhatsApp</a>');}
function reorder(){var raw=LSget('cy2-last');if(!raw)return;try{JSON.parse(raw).forEach(function(it){var p=findP(it.pid);if(!p||p.stock<=0)return;var key=vkey(it.variant),f=null;
  cart.forEach(function(l){if(l.pid===it.pid&&l.vkey===key)f=l;});
  if(f)f.qty=Math.min(p.stock,f.qty+it.qty);else cart.push({pid:it.pid,variant:it.variant,vkey:key,qty:Math.min(p.stock,it.qty)});});
 persistCart();renderCartBadge();toast('Pedido anterior cargado ✔','good');openCart();}catch(e){}}

/* ═════════ CHECKOUT ═════════ */
var PROVINCES_LIST=['Distrito Nacional','Santo Domingo Este','Santo Domingo Oeste','Santo Domingo Norte','Santiago','La Vega','Puerto Plata','Punta Cana','La Romana','San Pedro de Macorís','San Cristóbal','Barahona'];
function openCheckout(){if(!cart.length){toast('Tu carrito está vacío','warn');return;}closeCart();
 state.co={step:1,name:'',prefix:'809',phone:'',province:'',shipId:'',address:'',pickupId:'',notes:'',payId:'',bankId:''};
 show('checkout');renderCheckout();}
function show(v){state.view=v;['auth','tienda','checkout','confirm','admin'].forEach(function(k){$('#v-'+k).style.display=(k===v)?'block':'none';});
 $('#bottomBar').style.display=(v==='tienda')?'flex':'none';
 if(v==='tienda')renderCatalog();window.scrollTo(0,0);}
function goTienda(){show('tienda');}
function shipOptions(){var z=zoneOf(state.co.province);return DB.settings.shipping.filter(function(m){if(!state.co.province)return true;

function msSave(){var ms=window._ms;
 if(!ms.name.trim())return toast('Escribe el nombre del cliente','warn');
 if(!ms.lines.length)return toast('Agrega al menos un artículo','warn');
 DB.seq.order+=1;
 var items=ms.lines.map(function(l){var p=findP(l.pid);return {pid:p.id,code:p.code||'',name:p.name,variant:{},qty:l.qty,unit_price:p.price,cost:p.cost,line_total:p.price*l.qty};});
 var sub=items.reduce(function(a,i){return a+i.line_total;},0);
 var due=new Date();if(ms.pay==='credito')due.setDate(due.getDate()+30);
 var o={id:uid(),number:'RD-'+('000'+DB.seq.order).slice(-4),created_at:new Date().toISOString(),customer_name:ms.name.trim(),customer_phone:ms.phone?'+1'+ms.phone:'',
  province:'Venta manual',shipping_method:'pickup',shipping_cost:0,address:'',pickup_point:'',notes:'Registrada manualmente en el panel',
  payment_method:ms.pay,payment_status:ms.paid?'pagado':'pendiente',status:ms.status,subtotal:sub,discount:0,total:sub,due_date:due.toISOString(),wa_sent_at:new Date().toISOString(),items:items};
 items.forEach(function(it){var p=findP(it.pid);if(p)p.stock=Math.max(0,p.stock-it.qty);});
 DB.orders.unshift(o);
 if(ms.paid){DB.payments.push({id:uid(),order_id:o.id,amount:sub,method:ms.pay,reference:'Venta manual',received_at:new Date().toISOString()});
  DB.seq.receipt+=1;DB.receipts.unshift({id:uid(),number:'R-'+('000'+DB.seq.receipt).slice(-4),order_id:o.id,issued_at:new Date().toISOString()});}

 else DB.products.unshift({id:uid(),code:code,subcat:sub,name:name,cat:cat,price:price,cost:cost,stock:stock,desc:$('#fDesc').value,sizes:sizes,colors:colors,hue:200,image:prodImg});

/* finanzas rediseñadas */
function renderFin(b){var days=state.finPeriod,cut=new Date();cut.setDate(cut.getDate()-days);
 var os=DB.orders.filter(function(o){return o.status!=='cancelado'&&new Date(o.created_at)>=cut;});
 var rev=0,cogs=0,per={};
 os.forEach(function(o){o.items.forEach(function(it){rev+=it.line_total;cogs+=it.cost*it.qty;
  var e=per[it.pid]||{name:it.name,units:0,rev:0,cost:0};e.units+=it.qty;e.rev+=it.line_total;e.cost+=it.cost*it.qty;per[it.pid]=e;});});
 var gain=rev-cogs,mg=rev?Math.round(gain/rev*100):0;
 var weeks=[0,0,0,0];os.forEach(function(o){var d=(Date.now()-new Date(o.created_at))/86400000;var w=3-Math.floor(d/7);if(w>=0&&w<4)weeks[w]+=o.subtotal;});
 var mx=Math.max.apply(null,weeks.concat([1]));
 var rows=Object.keys(per).map(function(k){return per[k];}).sort(function(a,b2){return (b2.rev-b2.cost)-(a.rev-a.cost);});
 b.innerHTML='<div class="finance-section">'+
  '<h3 style="font-size:17px;font-weight:700;margin-bottom:16px">Rendimiento del período</h3>'+
  '<div class="chips" style="margin-bottom:16px">'+[7,30,90,365].map(function(d){return '<button class="chip '+(days===d?'on':'')+'" onclick="state.finPeriod='+d+';renderAdmin()">Últimos '+d+' d</button>';}).join('')+'</div>'+
  '<div class="kpis"><div class="kpi"><b>'+fmt(rev)+'</b><span>Ingresos</span></div><div class="kpi"><b>'+fmt(cogs)+'</b><span>COGS</span></div><div class="kpi"><b class="ok">'+fmt(gain)+'</b><span>Ganancia</span></div><div class="kpi"><b class="'+(mg<15?'red':'ok')+'">'+mg+'%</b><span>Margen</span></div></div>'+
  '</div>'+
  '<div class="finance-section"><h3 style="font-size:17px;font-weight:700;margin-bottom:12px">Tendencia semanal (4 sem)</h3><div class="bars">'+weeks.map(function(w){return '<i style="height:'+Math.round(w/mx*100)+'%"></i>';}).join('')+'</div></div>'+
  '<div class="finance-section"><h3 style="font-size:17px;font-weight:700;margin-bottom:12px">Detalle por producto</h3>'+
  '<div style="overflow-x:auto"><table class="fin"><tr><th>Producto</th><th>Uds</th><th>Ingresos</th><th>COGS</th><th>Ganancia</th><th>Margen</th></tr>'+
  rows.map(function(r){var m=r.rev?Math.round((r.rev-r.cost)/r.rev*100):0;
   return '<tr><td style="font-weight:600">'+esc(r.name)+'</td><td>'+r.units+'</td><td>'+fmt(r.rev)+'</td><td>'+fmt(r.cost)+'</td><td><b>'+fmt(r.rev-r.cost)+'</b></td><td><span class="pill '+(m>=40?'ok':m<15?'out':'low')+'">'+m+'%</span></td></tr>';}).join('')+'</table></div></div>';}

function sbBadKey(err){ if(err && /api key|unauthorized|jwt/i.test(err.message||'')) toast('Clave API inválida: revisa SB_KEY (confusión O/0 al copiar)','warn'); }
async function sbPullStore(uid){
  var s = await sb.from('stores').select('*').eq('id', uid).single();
  if(s.error) sbBadKey(s.error);
  if(!s.data) return null; var r = s.data;
  var db = {id:r.id, name:r.name, handle:r.handle, email:r.email, bio:r.bio||'', logo:r.logo||'', phone:r.phone||'',
            settings:(r.settings && Object.keys(r.settings).length) ? r.settings : DEFSettings(),
            seq:r.seq||{order:0,receipt:0}, _anon:false};
  var ps = await sb.from('products').select('*').eq('store_id', uid);
  db.products = (ps.data||[]).map(function(x){return x.doc;});
  for(var i=0;i<COLS.length;i++){ var q = await sb.from(COLS[i]).select('*').eq('store_id', uid);
    db[COLS[i]] = (q.data||[]).map(function(x){return x.doc;}); }
  return db;
}
async function sbPullPublic(handle){
  var s = await sb.from('store_public').select('*').eq('handle', handle).single();
  if(s.error) sbBadKey(s.error);
  if(!s.data) return null; var r = s.data;
  var db = {id:r.id, name:r.name, handle:r.handle, email:'', bio:r.bio||'', logo:r.logo||'', phone:r.phone||'',
            settings:(r.settings && Object.keys(r.settings).length) ? r.settings : DEFSettings(),
            seq:{order:0,receipt:0}, _anon:true, orders:[], customers:[], payments:[], receipts:[], posts:[], abandoned:[]};
  var ps = await sb.from('products_public').select('*').eq('store_id', r.id);
  db.products = (ps.data||[]).map(function(x){return x.doc;});
  var rv = await sb.from('reviews').select('*').eq('store_id', r.id);
  db.reviews = (rv.data||[]).map(function(x){return x.doc;});
  return db;
}
var pushT = null;
function sbPush(){ if(!sb || !DB || DB._anon) return; clearTimeout(pushT); pushT = setTimeout(sbPushNow, 900); }
async function sbPushNow(){
  var uid = DB.id;
  await sb.from('stores').update({name:DB.name, handle:DB.handle, bio:DB.bio, logo:DB.logo, phone:DB.phone, settings:DB.settings, seq:DB.seq}).eq('id', uid);
  for(var i=0;i<COLS.length;i++){
    var c = COLS[i], ids = DB[c].map(function(d){return d.id;});
    var rows = DB[c].map(function(d){ var row = {id:d.id, store_id:uid, doc:d}; if(c==='orders') row.number = d.number; return row; });
    if(ids.length) await sb.from(c).delete().eq('store_id', uid).not('id', 'in', '(' + ids.join(',') + ')');
    else await sb.from(c).delete().eq('store_id', uid);
    if(rows.length) await sb.from(c).upsert(rows);
  }
  var ps = DB.products.map(function(p){ return {id:p.id, store_id:uid, doc:p}; });
  var pids = DB.products.map(function(p){return p.id;});
  if(pids.length) await sb.from('products').delete().eq('store_id', uid).not('id', 'in', '(' + pids.join(',') + ')');
  else await sb.from('products').delete().eq('store_id', uid);
  if(ps.length) await sb.from('products').upsert(ps);
}
function sbRealtime(){
  sb.channel('rt-' + DB.id).on('postgres_changes',
    {event:'*', schema:'public', table:'products', filter:'store_id=eq.' + DB.id},
    function(ev){
      if(ev.eventType === 'DELETE'){ DB.products = DB.products.filter(function(p){return p.id !== ev.old.id;}); }
      else { var doc = ev.new.doc, f = null;
        DB.products.forEach(function(p){ if(p.id === doc.id) f = p; });
        if(f){ for(var k in doc) f[k] = doc[k]; } else DB.products.unshift(doc); }
      renderCatalog(); renderCartBadge();
      if(state.view === 'admin') renderAdmin();
    }).subscribe();
}

    } else {

      authTab('login');
    }
  };
  logout = async function(){ await sb.auth.signOut(); DB = null; cart = []; persistCart(); renderCartBadge(); show('auth'); toast('Sesión cerrada', 'good'); };
  confirmOrder = async function(){
    var co = state.co;
    if(!co.payId) return toast('Selecciona método de pago', 'warn');
    if(co.payId === 'transfer' && !co.bankId) return toast('Selecciona el banco', 'warn');
    var c = cartCalc(), m = shipLabel(co.shipId);
    var ship = (m.id === 'local' && c.subtotal >= DB.settings.free_threshold) ? 0 : m.price;
    var payId = co.payId === 'transfer' ? co.bankId : (co.payId === 'cod' ? 'cod' : (co.payId === 'credit' ? 'credito' : 'card_azul'));

    var o = {id:uid(), number:'', created_at:'', customer_name:co.name.trim(), customer_phone:'+1'+co.prefix+co.phone,
      province:co.province, shipping_method:co.shipId, shipping_cost:ship, address:co.address, pickup_point:co.pickupId, notes:co.notes,
      payment_method:payId, payment_status:'pendiente', status:'pendiente', subtotal:c.subtotal, discount:c.discount,
      total:c.net + ship, due_date:dueN.toISOString(), wa_sent_at:null,
      items:cart.map(function(l){ var p = findP(l.pid);
