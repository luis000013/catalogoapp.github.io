<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CatálogoYa · Tu tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#f4f4f2; --surface:#ffffff; --surface2:#f1f1ee; --border:rgba(20,20,18,.14); --border2:rgba(20,20,18,.08);
 --text:#171715; --text2:#6d6c68; --primary:#171715; --primary-text:#ffffff;
 --ok:#16a34a; --ok-bg:rgba(22,163,74,.12); --amber:#b45309; --amber-bg:rgba(217,119,6,.14);
 --blue:#2563eb; --blue-bg:rgba(37,99,235,.12); --red:#dc2626; --red-bg:rgba(220,38,38,.12);
 --wa:#1FA45F; --shadow:0 12px 32px -14px rgba(0,0,0,.22);}
html[data-theme="dark"]{ --bg:#141311; --surface:#1e1d1a; --surface2:#262522; --border:rgba(255,255,255,.12); --border2:rgba(255,255,255,.07);
 --text:#f4f3f0; --text2:#a09e99; --primary:#ffffff; --primary-text:#151412;
 --ok:#4ade80; --ok-bg:rgba(34,197,94,.16); --amber:#fbbf24; --amber-bg:rgba(245,158,11,.16);
 --blue:#60a5fa; --blue-bg:rgba(59,130,246,.18); --red:#f87171; --red-bg:rgba(239,68,68,.16);
 --wa:#25D366; --shadow:0 12px 32px -14px rgba(0,0,0,.65);}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.btn{padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)} .btn svg{margin-right:8px;flex:none}
.btn-primary{background:var(--primary);color:var(--primary-text)}
.btn-outline{border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn-wa{background:var(--wa);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none} .btn+.btn{margin-left:10px}
.circle-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
.sq-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
.pill{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;flex:none}
.pill.ok,.pill.entregado,.pill.pagado{background:var(--ok-bg);color:var(--ok)}
.pill.low,.pill.pendiente,.pill.parcial{background:var(--amber-bg);color:var(--amber)}
.pill.info,.pill.enviado{background:var(--blue-bg);color:var(--blue)}
.pill.out,.pill.cancelado,.pill.vencido{background:var(--red-bg);color:var(--red)}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);outline:none;font-size:14px}
.inp:focus{border-color:var(--text2)}
.searchwrap{position:relative;flex:1;min-width:180px;max-width:340px;margin-right:10px}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2)}
.searchwrap .inp{padding-left:38px}
.field{margin-bottom:14px} .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin-bottom:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px;gap:12px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.chips{display:flex;overflow-x:auto;padding:4px 2px;scrollbar-width:none} .chips::-webkit-scrollbar{display:none}
.chip{flex:none;margin-right:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:600;font-size:14px;display:inline-flex;align-items:center}
.chip svg{margin-right:7px} .chip.on{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.shead{display:flex;align-items:flex-start;padding:22px 0 8px}
.logo{width:56px;height:56px;margin-right:14px;flex:none;border-radius:16px;background:var(--primary);color:var(--primary-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.shead h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px;color:var(--text2)}
.meta>*{margin:4px 10px 0 0}
.live{display:inline-flex;align-items:center;background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px}
.dot{width:7px;height:7px;margin-right:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}55%{opacity:.35}}
.bio{margin-top:10px;font-size:13.5px;line-height:1.55;color:var(--text);white-space:pre-line;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:12px;gap:12px;padding:14px 0 110px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);grid-gap:16px;gap:16px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.pcard{background:var(--surface);border:1px solid var(--border2);border-radius:16px;overflow:hidden;text-align:left;transition:transform .2s,box-shadow .2s;animation:pop .4s both}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tile{position:relative;padding-bottom:100%;overflow:hidden;background-size:cover;background-position:center}
.tile .tic{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;transition:transform .4s}
.pcard:hover .tic{transform:scale(1.1)}
.tile.sold{filter:grayscale(1) opacity(.55)}
.tb{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.tb.low{background:var(--amber-bg);color:var(--amber)} .tb.out{background:var(--red-bg);color:var(--red)}
.tb.star{left:auto;top:auto;right:10px;bottom:10px;background:rgba(0,0,0,.5);color:#fbbf24}
.pinfo{padding:12px 14px 14px}
.pcat{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);font-weight:700}
.pname{font-weight:600;font-size:15px;margin:4px 0 6px;line-height:1.3}
.pprice{font-weight:700;font-size:15px}
.row{display:flex;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.row-main{flex:1;min-width:150px} .row-main b{font-size:15px;font-weight:600} .row-main small{display:block;color:var(--text2);font-size:12px;margin-top:3px}
.sw{width:46px;height:46px;margin-right:14px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.icon-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text2);flex:none}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.stepper{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:2px}
.stepper button{width:28px;height:28px;border-radius:8px;font-weight:800;font-size:15px}
.stepper span{width:30px;text-align:center;font-weight:700;font-size:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px;margin:14px 0}
@media(min-width:860px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:16px}
.kpi b{display:block;font-size:28px;font-weight:800;line-height:1.1}
.kpi b.amber{color:var(--amber)} .kpi b.ok{color:var(--ok)} .kpi b.red{color:var(--red)}
.kpi span{font-size:12px;color:var(--text2)}
.tabs{display:flex;flex-wrap:wrap;margin-bottom:16px}
.opt{display:block;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:13px 15px;margin-bottom:10px;cursor:pointer}
.opt.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.opt.off{opacity:.45;cursor:not-allowed}
.opt b{font-size:14px;font-weight:600} .opt small{display:block;color:var(--text2);font-size:12px;margin-top:3px}
.opt .pr{float:right;font-weight:700}
.bk{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.bk.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:50;background:var(--surface);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .4s cubic-bezier(.32,.72,.28,1);display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer .hd{padding:18px 20px 12px;border-bottom:1px solid var(--border2)}
.drawer .bd{flex:1;overflow-y:auto;padding:16px 20px}
.drawer .ft{padding:14px 20px 18px;border-top:1px solid var(--border2)}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:24px;width:min(430px,92%);max-height:86vh;overflow-y:auto;box-shadow:var(--shadow);z-index:60}
.cline{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border2)}
.meter{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .4s}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottombar .in{max-width:1080px;margin:0 auto;width:100%;display:flex;align-items:center}
.bottombar .cart{margin-left:auto;border-radius:999px;padding:12px 20px}
.bottombar .cart .bdg{background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:1px 8px;margin-left:8px;font-size:12px;font-weight:800}
.sumbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.sumbar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;flex-wrap:wrap}
.sumbar .tot{flex:1;min-width:150px;font-size:13px;color:var(--text2)}
.sumbar .tot b{display:block;font-size:22px;font-weight:800;color:var(--text)}
.conf-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:22px;margin-bottom:14px}
.bankline{display:flex;align-items:center;flex-wrap:wrap;background:var(--surface2);border:1px dashed var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px}
.bankline b{margin-right:8px} .bankline button{margin-left:auto;font-size:12px;font-weight:800;color:var(--blue)}
.msgbox{background:var(--ok-bg);border:1px dashed var(--ok);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text)}
.steps{display:flex;align-items:center;margin:18px 0}
.stepdot{width:30px;height:30px;border-radius:50%;background:var(--surface2);color:var(--text2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.stepdot.on{background:var(--primary);color:var(--primary-text)} .stepdot.done{background:var(--ok);color:#fff}
.steplab{margin-left:8px;font-weight:600;font-size:13px;margin-right:18px}
table.fin{width:100%;border-collapse:collapse;font-size:13px}
table.fin th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);padding:6px 8px;border-bottom:1px solid var(--border)}
table.fin td{padding:9px 8px;border-bottom:1px solid var(--border2)}
.bars{display:flex;align-items:flex-end;height:70px;margin:10px 0}
.bars i{flex:1;margin-right:6px;background:var(--ok);opacity:.85;border-radius:6px 6px 0 0;min-height:4px}
.stars{color:#fbbf24;font-size:12px;letter-spacing:1px}
.authcard{max-width:430px;margin:7vh auto;background:var(--surface);border:1px solid var(--border2);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.authcard h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.imgprev{width:86px;height:86px;border-radius:14px;border:1px dashed var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text2);flex:none}
.imgprev img{width:100%;height:100%;object-fit:cover}
#toasts{position:fixed;left:16px;bottom:86px;z-index:90;display:flex;flex-direction:column}
.toast{margin-top:8px;background:var(--primary);color:var(--primary-text);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;max-width:330px;animation:tin .35s both;display:flex;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.toast.good{border-left:4px solid var(--wa)} .toast.warn{border-left:4px solid var(--amber)}
.toast button{margin-left:10px;font-weight:800;font-size:12px;opacity:.85}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
.foot{text-align:center;padding:10px 0 110px;font-size:12px;color:var(--text2)}
#printArea{background:#fff;color:#111}
#printArea h2{font-size:20px;margin-bottom:4px}
#printArea table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
#printArea td,#printArea th{padding:5px 4px;border-bottom:1px solid #ddd;text-align:left}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;padding:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="v-auth" class="wrap" style="display:none">
  <div class="authcard">
    <div style="display:flex;align-items:center;margin-bottom:6px">
      <div class="logo" style="width:44px;height:44px;font-size:15px;margin-right:12px">CY</div>
      <div><h1>CatálogoYa</h1><p style="font-size:13px;color:var(--text2)">Tu tienda en línea con cierre por WhatsApp</p></div>
    </div>
    <div class="chips" style="margin:14px 0">
      <button class="chip on" id="authTabLogin" onclick="authTab('login')">Iniciar sesión</button>
      <button class="chip" id="authTabReg" onclick="authTab('reg')">Crear tienda</button>
    </div>
    <div id="authLogin">
      <div class="field"><label>Email</label><input class="inp" id="liEmail" type="email" placeholder="tu@tienda.com"></div>
      <div class="field"><label>Contraseña</label><input class="inp" id="liPass" type="password" placeholder="••••••"></div>
      <p id="liErr" style="color:var(--red);font-size:13px;font-weight:600;margin-bottom:8px"></p>
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Entrar a mi panel</button>
      <button class="btn btn-outline" style="width:100%;margin:10px 0 0" onclick="loginDemo()">✨ Entrar a la tienda demo</button>
    </div>
    <div id="authReg" style="display:none">
      <div class="field"><label>Nombre de la tienda *</label><input class="inp" id="rgName" placeholder="Alma Bazar" oninput="autoHandle(this.value)"></div>
      <div class="field"><label>@handle</label><input class="inp" id="rgHandle" placeholder="alma-bazar"></div>
      <div class="field"><label>Email *</label><input class="inp" id="rgEmail" type="email" placeholder="tu@tienda.com"></div>
      <div class="field"><label>Contraseña * (mín. 6)</label><input class="inp" id="rgPass" type="password"></div>
      <p id="rgErr" style="color:var(--red);font-size:13px;font-weight:600;margin-bottom:8px"></p>
      <button class="btn btn-primary" style="width:100%" onclick="doRegister()">Crear mi tienda 🚀</button>
    </div>
    <p style="font-size:11.5px;color:var(--text2);margin-top:14px">Demo local: las cuentas se guardan en este navegador. En producción: Supabase Auth.</p>
  </div>
</div>

<!-- TIENDA -->
<div id="v-tienda" class="wrap" style="display:none">
  <header class="shead">
    <div class="logo" id="storeLogo">AB</div>
    <div style="flex:1">
      <h1 id="storeName"></h1>
      <div class="meta">
        <span class="live"><span class="dot"></span>Stock en vivo</span>
        <span id="metaCount"></span>
        <span id="storeHandle"></span>
        <span id="reorderSlot"></span>
      </div>
      <div class="bio" id="storeBio"></div>
    </div>
    <button class="circle-btn" id="themeBtn" onclick="toggleTheme()" title="Cambiar tema"></button>
  </header>
  <div style="display:flex;flex-wrap:wrap;align-items:center;padding:8px 0 4px">
    <div class="searchwrap"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="inp" placeholder="Buscar por nombre o código" oninput="state.q=this.value;renderCatalog()"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="chips" id="subchips" style="margin-top:2px"></div>
  <div class="grid" id="grid"></div>
  <p class="foot">CatálogoYa 2.0 · demo funcional</p>
</div>

<!-- CHECKOUT -->
<div id="v-checkout" class="wrap" style="display:none;padding-bottom:120px">
  <div style="display:flex;align-items:center;padding:22px 0 0">
    <button class="btn btn-outline" onclick="goTienda()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Tienda</button>
    <b style="margin-left:14px;font-size:20px;font-weight:700">Finalizar pedido</b>
  </div>
  <div class="steps" id="steps"></div>
  <div id="coBody"></div>
</div>

<!-- CONFIRMACIÓN -->
<div id="v-confirm" class="wrap" style="display:none;padding:26px 16px 60px"><div id="confBody"></div></div>

<!-- ADMIN -->
<div id="v-admin" class="wrap" style="display:none">
  <div class="row" style="margin-top:20px;padding:18px">
    <div class="logo" id="adminLogo" style="width:48px;height:48px;font-size:16px;margin-right:14px">AB</div>
    <div class="row-main"><b style="font-size:18px" id="adminTitle">Panel</b><small style="color:var(--ok);display:flex;align-items:center"><span class="dot" style="background:var(--ok)"></span>Tiempo real activo</small></div>
    <button class="circle-btn" id="themeBtn2" onclick="toggleTheme()"></button>
    <button class="sq-btn" style="margin-left:8px" onclick="logout()" title="Cerrar sesión"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    <button class="btn btn-outline" style="margin-left:8px" onclick="goTienda()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Tienda</button>
    <div style="width:100%;display:flex;margin-top:14px">
      <button class="btn btn-primary" style="flex:1" onclick="simulateSale()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>Nueva venta</button>
      <button class="sq-btn" style="margin-left:10px" onclick="resetDemo()" title="Restaurar demo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>
  </div>
  <div class="tabs chips" id="adminTabs" style="padding-top:6px"></div>
  <div id="adminBody"></div>
  <p class="foot">Conecta Supabase para sincronizar entre dispositivos.</p>
</div>

<!-- overlays -->
<div class="bk" id="cartBk" onclick="closeCart()"></div>
<div class="drawer" id="cartDr"><div class="hd" id="cartHd"></div><div class="bd" id="cartBd"></div><div class="ft" id="cartFt"></div></div>
<div class="bk" id="orderBk" style="z-index:55" onclick="closeOrder()"></div>
<div class="drawer" id="orderDr" style="z-index:56"><div class="hd" id="ordHd"></div><div class="bd" id="ordBd"></div></div>
<div class="bk" id="prodBk" style="z-index:55" onclick="closeProd()"></div>

 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Copiado ✔','good');},fb);}else fb();}

/* ═════════ CARRITO ═════════ */
function vkey(v){var ks=Object.keys(v).sort(),out=[];ks.forEach(function(k){out.push(k+'='+v[k]);});return out.join('|');}
function addToCart(pid,variant,qty){var p=findP(pid);if(!p||p.stock<=0)return;var key=vkey(variant),found=null;
 cart.forEach(function(l){if(l.pid===pid&&l.vkey===key)found=l;});
 if(found)found.qty=Math.min(p.stock,found.qty+qty);else cart.push({pid:pid,variant:variant,vkey:key,qty:Math.min(p.stock,qty)});
 persistCart();renderCartBadge();toast('Agregado: '+p.name,'good');openCart();}
function cartCalc(){var lines=[],sub=0;cart.forEach(function(l){var p=findP(l.pid);if(!p)return;var lt=p.price*l.qty;sub+=lt;lines.push({l:l,p:p,lt:lt});});
 var disc=0;if(sub>=DB.settings.promo.min)disc=Math.round(sub*DB.settings.promo.percent/100);return {lines:lines,subtotal:sub,discount:disc,net:sub-disc};}
function renderCartBadge(){var n=0;cart.forEach(function(l){n+=l.qty;});var t='RD$ 0';
 if(DB){t=fmt(cartCalc().net);}$('#fabCart').innerHTML=ic('cart',18)+'<span style="margin-left:8px">'+t+'</span><span class="bdg">'+n+'</span>';}
function openCart(){$('#cartBk').className='bk show';$('#cartDr').className='drawer show';renderCart();}
function closeCart(){$('#cartBk').className='bk';$('#cartDr').className='drawer';}
function renderCart(){var c=cartCalc();
 $('#cartHd').innerHTML='<div style="display:flex;align-items:center"><b style="font-size:18px;font-weight:700;flex:1">Tu carrito</b><button class="icon-btn" onclick="closeCart()">'+ic('x',18)+'</button></div>';
 if(!c.lines.length){$('#cartBd').innerHTML='<p style="text-align:center;color:var(--text2);padding:50px 0">Tu carrito está vacío.</p>';$('#cartFt').innerHTML='';return;}
 var rem=DB.settings.free_threshold-c.subtotal;
 $('#cartBd').innerHTML='<div style="font-size:12.5px;font-weight:700;color:'+(rem>0?'var(--amber)':'var(--ok)')+'">'+(rem>0?'🚚 Agrega '+fmt(rem)+' más para envío gratis en Santo Domingo':'🎉 ¡Envío gratis en Santo Domingo!')+'</div><div class="meter"><i style="width:'+Math.min(100,Math.round(c.subtotal/DB.settings.free_threshold*100))+'%"></i></div>'+
 c.lines.map(function(x,i){return '<div class="cline">'+swHTML(x.p)+'<div class="row-main" style="min-width:100px"><b style="font-size:14px">'+esc(x.p.name)+'</b><small>'+esc(Object.keys(x.l.variant).map(function(k){return x.l.variant[k];}).join(' · '))+' · '+fmt(x.p.price)+'</small></div>'+
  '<div class="stepper"><button onclick="setQty('+i+','+(x.l.qty-1)+')">−</button><span>'+x.l.qty+'</span><button onclick="setQty('+i+','+(x.l.qty+1)+')">+</button></div>'+
  '<b style="margin-left:10px;min-width:66px;text-align:right;font-size:14px">'+fmt(x.lt)+'</b><button class="icon-btn" onclick="removeLine('+i+')">'+ic('trash',16)+'</button></div>';}).join('');
 var dsc=c.discount>0?'<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ok);font-weight:700;margin-top:6px"><span>Promo ('+DB.settings.promo.percent+'%)</span><span>−'+fmt(c.discount)+'</span></div>':'';
 $('#cartFt').innerHTML='<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text2)"><span>Subtotal</span><span>'+fmt(c.subtotal)+'</span></div>'+dsc+
  '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:6px 0 12px"><span>Total</span><span>'+fmt(c.net)+'</span></div>'+
  '<button class="btn btn-primary" style="width:100%" onclick="openCheckout()">Continuar pedido →</button>';}
function setQty(i,q){if(q<=0){removeLine(i);return;}var p=findP(cart[i].pid);cart[i].qty=Math.min(p?p.stock:99,q);persistCart();renderCartBadge();renderCart();}
var lastRemoved=null;
function removeLine(i){lastRemoved={line:cart[i],i:i};cart.splice(i,1);persistCart();renderCartBadge();renderCart();
 toast('Artículo removido','warn','DESHACER',function(){cart.splice(lastRemoved.i,0,lastRemoved.line);persistCart();renderCartBadge();renderCart();});}

 fileToDataURL(inp.files[0],640,false,function(d){prodImg=d;renderProdImgPrev();toast('Foto lista ✔','good');});}
function renderProdImgPrev(){var el=$('#prodImgPrev');if(el)el.innerHTML=prodImg?'<img src="'+prodImg+'" alt="">':ic('cam',24);}
function closeProd(){$('#prodBk').className='bk';$('#prodDr').className='drawer';}
function saveProd(){var id=$('#fId').value,name=$('#fName').value.trim(),price=parseFloat($('#fPrice').value),cost=parseFloat($('#fCost').value),stock=parseInt($('#fStock').value,10);
 if(!name||isNaN(price)||isNaN(cost)||isNaN(stock))return toast('Completa nombre, precio, costo y stock','warn');
 var sizes=$('#fSizes').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
 var cn=$('#fColors').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
 var colors=cn.length?cn.map(function(n){return {n:n};}):[{n:'Único'}];
 var code=$('#fCode').value.trim(),sub=$('#fSub').value,cat=$('#fCat').value;
 if(id){var p=findP(id);p.name=name;p.price=price;p.cost=cost;p.stock=stock;p.cat=cat;p.subcat=sub;p.code=code;p.sizes=sizes;p.colors=colors;p.desc=$('#fDesc').value;p.image=prodImg;}
 else DB.products.unshift({id:uid(),code:code,subcat:sub,name:name,cat:cat,price:price,cost:cost,stock:stock,desc:$('#fDesc').value,sizes:sizes,colors:colors,hue:200,image:prodImg});
 persist();closeProd();renderAdmin();renderCatalog();toast('Guardado ✔','good');}
/* finanzas */
function renderFin(b){var days=state.finPeriod,cut=new Date();cut.setDate(cut.getDate()-days);
 var os=DB.orders.filter(function(o){return o.status!=='cancelado'&&new Date(o.created_at)>=cut;});
 var rev=0,cogs=0,per={};
 os.forEach(function(o){o.items.forEach(function(it){rev+=it.line_total;cogs+=it.cost*it.qty;
  var e=per[it.pid]||{name:it.name,units:0,rev:0,cost:0};e.units+=it.qty;e.rev+=it.line_total;e.cost+=it.cost*it.qty;per[it.pid]=e;});});
 var gain=rev-cogs,mg=rev?Math.round(gain/rev*100):0;
 var weeks=[0,0,0,0];os.forEach(function(o){var d=(Date.now()-new Date(o.created_at))/86400000;var w=3-Math.floor(d/7);if(w>=0&&w<4)weeks[w]+=o.subtotal;});
 var mx=Math.max.apply(null,weeks.concat([1]));
 var rows=Object.keys(per).map(function(k){return per[k];}).sort(function(a,b2){return (b2.rev-b2.cost)-(a.rev-a.cost);});
 b.innerHTML='<div class="chips" style="margin-bottom:10px">'+[7,30,90,365].map(function(d){return '<button class="chip '+(days===d?'on':'')+'" onclick="state.finPeriod='+d+';renderAdmin()">Últimos '+d+' d</button>';}).join('')+'</div>'+
  '<div class="kpis"><div class="kpi"><b>'+fmt(rev)+'</b><span>Ingresos</span></div><div class="kpi"><b>'+fmt(cogs)+'</b><span>COGS</span></div><div class="kpi"><b class="ok">'+fmt(gain)+'</b><span>Ganancia</span></div><div class="kpi"><b class="'+(mg<15?'red':'ok')+'">'+mg+'%</b><span>Margen</span></div></div>'+
  '<span style="font-size:12px;color:var(--text2)">Tendencia semanal (4 sem)</span><div class="bars">'+weeks.map(function(w){return '<i style="height:'+Math.round(w/mx*100)+'%"></i>';}).join('')+'</div>'+
  '<div style="overflow-x:auto"><table class="fin"><tr><th>Producto</th><th>Uds</th><th>Ingresos</th><th>COGS</th><th>Ganancia</th><th>Margen</th></tr>'+
  rows.map(function(r){var m=r.rev?Math.round((r.rev-r.cost)/r.rev*100):0;
   return '<tr><td>'+esc(r.name)+'</td><td>'+r.units+'</td><td>'+fmt(r.rev)+'</td><td>'+fmt(r.cost)+'</td><td><b>'+fmt(r.rev-r.cost)+'</b></td><td><span class="pill '+(m>=40?'ok':m<15?'out':'low')+'">'+m+'%</span></td></tr>';}).join('')+'</table></div>';}
/* cxc */
function renderCxC(b){var open=DB.orders.filter(function(o){return o.status!=='cancelado'&&balanceOf(o)>0;});
 var bk={'Al día':0,'1–30':0,'31–60':0,'61–90':0,'90+':0};
 function bOf(o){var d=Math.floor((Date.now()-new Date(o.due_date))/86400000);if(d<=0)return 'Al día';if(d<=30)return '1–30';if(d<=60)return '31–60';if(d<=90)return '61–90';return '90+';}
 open.forEach(function(o){bk[bOf(o)]+=balanceOf(o);});
 b.innerHTML='<div class="kpis">'+Object.keys(bk).map(function(k){return '<div class="kpi"><b class="'+(k==='Al día'?'ok':'red')+'">'+fmt(bk[k])+'</b><span>'+k+'</span></div>';}).join('')+'</div>'+
  open.map(function(o){var k=bOf(o);
   return '<div class="row"><div class="row-main"><b>'+esc(o.customer_name)+' · #'+o.number+'</b><small>Vence '+fDate(o.due_date)+' · saldo '+fmt(balanceOf(o))+'</small></div>'+
    '<span class="pill '+(k==='Al día'?'ok':'out')+'" style="margin-right:8px">'+k+'</span>'+
    '<a class="btn btn-wa" style="padding:8px 14px;font-size:12px;margin-right:6px" target="_blank" rel="noopener noreferrer" href="https://wa.me/'+o.customer_phone.replace('+','')+'?text='+encodeURIComponent('Hola '+o.customer_name.split(' ')[0]+' 👋 Recordatorio: saldo '+fmt(balanceOf(o))+' del pedido #'+o.number+'.')+'">Recordar</a>'+
    '<button class="btn btn-primary" style="padding:8px 14px;font-size:12px" onclick="payModal(\''+o.id+'\')">Cobrar</button></div>';}).join('')||'<p style="color:var(--text2)">🎉 No hay saldos abiertos.</p>';}
/* crm */
function renderCRM(b){b.innerHTML='<div class="row"><input class="inp" id="ncName" style="flex:1;margin-right:8px" placeholder="Nombre"><input class="inp" id="ncWa" style="flex:1;margin-right:8px" placeholder="WhatsApp 809…"><button class="btn btn-primary" onclick="addCust()">'+ic('plus',16)+'</button></div>'+
 DB.customers.map(function(c,i){return '<div class="row" style="align-items:flex-start"><div class="sw" style="background:var(--surface2);color:var(--text2);border:1px solid var(--border)">'+esc(c.name.charAt(0))+'</div>'+
  '<div class="row-main"><b>'+esc(c.name)+'</b><small><a href="https://wa.me/'+c.wa+'" target="_blank" rel="noopener noreferrer">+1 '+esc(c.wa)+'</a> · '+(c.credit?'<span class="pill info">crédito 30 d</span>':'sin crédito')+'</small>'+
  '<textarea class="inp" style="margin-top:8px;min-height:44px" onblur="DB.customers['+i+'].notes=this.value;persist();toast(\'Nota guardada\',\'good\')">'+esc(c.notes)+'</textarea></div>'+
  '<select class="pill '+c.status+'" style="border:none;margin-right:6px" onchange="DB.customers['+i+'].status=this.value;persist();renderAdmin()"><option value="pendiente" '+(c.status==='pendiente'?'selected':'')+'>⏳ Pendiente</option><option value="enviado" '+(c.status==='enviado'?'selected':'')+'>🚚 Enviado</option><option value="entregado" '+(c.status==='entregado'?'selected':'')+'>✔ Entregado</option></select>'+
  '<label style="font-size:11px;font-weight:700;margin-right:6px"><input type="checkbox" '+(c.credit?'checked':'')+' onchange="DB.customers['+i+'].credit=this.checked;persist()"> crédito</label>'+
  '<button class="icon-btn" onclick="DB.customers.splice('+i+',1);persist();renderAdmin()">'+ic('trash',16)+'</button></div>';}).join('');}
function addCust(){var n=$('#ncName').value.trim(),w=$('#ncWa').value.replace(/\D/g,'');if(!n||!w)return toast('Nombre y WhatsApp obligatorios','warn');
 DB.customers.unshift({id:uid(),name:n,wa:w,status:'pendiente',notes:'',credit:false});persist();renderAdmin();toast('Cliente agregado','good');}
/* publicar */
function captionFor(p){var vs=[];if(p.sizes.length)vs.push('Tallas '+p.sizes.join('–'));if(p.colors.length)vs.push(p.colors.map(function(c){return c.n;}).join('/'));
 return '🖤 '+p.name+' — '+fmt(p.price)+'\n'+vs.join(' · ')+' · '+(p.stock>0?'✔ Disponible':'⛔ Agotado')+'\n📲 Pídelo: '+storeUrl()+'/p/'+p.id+'\n#modaRD #santodomingo';}
function renderPub(b){b.innerHTML='<div class="fgrid"><div><div class="field"><label>Producto</label><select class="inp" id="pubSel" onchange="renderPubPreview()">'+DB.products.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+'</option>';}).join('')+'</select></div>'+
  '<div id="pubPrev"></div><div class="field"><label>Caption (editable)</label><textarea class="inp" id="pubCap" rows="5"></textarea></div>'+
  '<div class="field"><label>Programar para</label><input class="inp" id="pubWhen" type="datetime-local"></div>'+
  '<button class="btn btn-primary" onclick="pubPost(false)">📸 Publicar en Instagram</button><button class="btn btn-outline" onclick="pubPost(true)">⏰ Programar</button></div>'+
  '<div><b style="font-size:15px;font-weight:700">Kit WhatsApp Status / Difusión</b>'+
  '<div style="margin:10px 0"><button class="btn btn-outline" onclick="copyText($(\'#pubCap\').value)">📋 Copiar caption</button><a class="btn btn-wa" id="pubWa" target="_blank" rel="noopener noreferrer" href="#">'+icWa(16)+'Abrir WhatsApp</a></div>'+
  '<div class="field"><label>Segmento</label><select class="inp" id="pubSeg" onchange="renderPubSeg()"><option value="todos">Todos los clientes</option><option value="calzado">Compraron Calzado</option><option value="entregados">Entregados últimos 90 d</option></select></div>'+
  '<div id="pubSegList"></div><b style="font-size:15px;font-weight:700;display:block;margin:16px 0 8px">Historial</b><div id="pubList"></div></div></div>';
 if(DB.products.length){renderPubPreview();}else{$('#pubPrev').innerHTML='<p style="color:var(--text2);font-size:13px">Crea productos para publicar.</p>';}
 renderPubSeg();
 $('#pubList').innerHTML=DB.posts.length?DB.posts.map(function(x){return '<div class="row"><div class="row-main"><b>'+esc(x.caption.split('\n')[0])+'</b><small>'+x.status+' · '+fDT(x.at)+'</small></div><span class="pill '+(x.status==='published'?'ok':'info')+'">'+x.status+'</span></div>';}).join(''):'<small style="color:var(--text2)">Sin publicaciones aún.</small>';}
function renderPubPreview(){var p=findP($('#pubSel').value);if(!p)return;$('#pubCap').value=captionFor(p);
 $('#pubPrev').innerHTML='<div style="border-radius:14px;overflow:hidden;margin-bottom:10px">'+tileOpen(p)+'</div></div>';
 $('#pubWa').href='https://wa.me/'+storePhone()+'?text='+encodeURIComponent(captionFor(p));}
function pubPost(sched){var p=findP($('#pubSel').value);if(!p)return toast('Crea un producto primero','warn');var when=$('#pubWhen').value;
 if(sched&&!when)return toast('Elige fecha y hora','warn');
 DB.posts.unshift({id:uid(),pid:p.id,caption:$('#pubCap').value,status:sched?'scheduled':'published',at:new Date().toISOString(),when:when});
 persist();renderAdmin();toast(sched?'Publicación programada ⏰ (simulado)':'Publicado en Instagram ✔ (simulado)','good');}
function renderPubSeg(){var seg=$('#pubSeg').value;
 var list=DB.customers.filter(function(c){if(seg==='todos')return true;
  var os=DB.orders.filter(function(o){return o.customer_phone==='+1'+c.wa;});
  if(seg==='calzado')return os.some(function(o){return o.items.some(function(it){var p=findP(it.pid);return p&&p.cat==='Calzado';});});
  return os.some(function(o){return o.status==='entregado'&&(Date.now()-new Date(o.created_at))/86400000<=90;});});
 var p=findP($('#pubSel').value);if(!p){$('#pubSegList').innerHTML='';return;}
 $('#pubSegList').innerHTML=list.map(function(c){return '<div class="row"><div class="row-main"><b>'+esc(c.name)+'</b><small>+1 '+esc(c.wa)+'</small></div><a class="btn btn-wa" style="padding:8px 14px;font-size:12px" target="_blank" rel="noopener noreferrer" href="https://wa.me/'+c.wa+'?text='+encodeURIComponent('Hola '+c.name.split(' ')[0]+' 👋 Llegó '+p.name+' a '+fmt(p.price)+'. Míralo: '+storeUrl()+'/p/'+p.id)+'">1-tap</a></div>';}).join('')||'<small style="color:var(--text2)">Sin clientes en este segmento.</small>';}
/* config + perfil de tienda */
function renderConfig(b){var s=DB.settings;
 b.innerHTML='<div class="row" style="align-items:flex-start;padding:18px"><div class="imgprev" style="width:72px;height:72px" id="logoPrev">'+(DB.logo?'<img src="'+DB.logo+'" alt="">':ic('cam',22))+'</div>'+
  '<div style="margin-left:14px;flex:1"><b style="font-size:15px;font-weight:700">Mi tienda (perfil público)</b>'+
  '<div style="display:flex;flex-wrap:wrap;margin-top:10px"><label class="btn btn-outline" style="cursor:pointer;margin:0 8px 8px 0">'+ic('cam',16)+'Subir logo<input type="file" accept="image/*" style="display:none" onchange="pickLogo(this)"></label>'+
  (DB.logo?'<button class="btn btn-outline" style="margin:0 8px 8px 0" onclick="DB.logo=\'\';persist();renderAdmin();toast(\'Logo quitado\',\'warn\')">Quitar logo</button>':'')+'</div>'+
  '<div class="fgrid"><div class="field"><label>Nombre</label><input class="inp" id="pfName" value="'+esc(DB.name)+'"></div>'+
  '<div class="field"><label>@handle</label><input class="inp" id="pfHandle" value="'+esc(DB.handle)+'"></div></div>'+
  '<div class="field"><label>WhatsApp (sin +1)</label><input class="inp" id="pfPhone" value="'+esc(DB.phone||'')+'" placeholder="8095550143"></div>'+
  '<div class="field"><label>Bio estilo Instagram · <span id="bioCount">'+(DB.bio?DB.bio.length:0)+'</span>/150</label><textarea class="inp" id="pfBio" rows="3" maxlength="150" oninput="bioCount(this.value)" placeholder="Tu tienda en 3 líneas…">'+esc(DB.bio||'')+'</textarea></div>'+
  '<button class="btn btn-primary" onclick="saveProfile()">Guardar perfil</button></div></div>'+
  '<div class="fgrid"><div class="field"><label>Umbral envío gratis (RD$)</label><input class="inp" id="cfgFree" type="number" value="'+s.free_threshold+'"></div>'+
  '<div class="field"><label>Umbral low-stock</label><input class="inp" id="cfgLow" type="number" value="'+s.low_stock+'"></div></div>'+
  '<div class="fgrid"><div class="field"><label>Promo: subtotal mín.</label><input class="inp" id="cfgPMin" type="number" value="'+s.promo.min+'"></div><div class="field"><label>Promo: % desc.</label><input class="inp" id="cfgPPct" type="number" value="'+s.promo.percent+'"></div></div>'+
  '<button class="btn btn-outline" style="margin-bottom:14px" onclick="saveCfg()">Guardar umbrales y promo</button>'+
  '<b style="font-size:14px;font-weight:700;display:block;margin:8px 0">Métodos de envío</b>'+s.shipping.map(function(m,i){return '<div class="row"><div class="row-main"><b>'+esc(m.label)+'</b><small>'+esc(m.eta)+'</small></div><input type="number" value="'+m.price+'" style="width:100px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text)" onchange="DB.settings.shipping['+i+'].price=parseFloat(this.value)||0;persist();toast(\'Envío actualizado\',\'good\')"></div>';}).join('')+
  '<b style="font-size:14px;font-weight:700;display:block;margin:8px 0">Contra entrega por zona</b><div class="chips" style="margin-bottom:12px">'+['ZONA_SD','ZONA_CIBAO','ZONA_ESTE','ZONA_SUR'].map(function(z){return '<button class="chip '+(s.cod_zones.indexOf(z)!==-1?'on':'')+'" onclick="toggleCod(\''+z+'\')">'+z+'</button>';}).join('')+'</div>'+
  '<b style="font-size:14px;font-weight:700;display:block;margin:8px 0">Cuentas bancarias</b>'+s.payments.filter(function(p){return p.type==='transfer';}).map(function(p){var i=s.payments.indexOf(p);
   return '<div class="row"><div class="row-main"><input class="inp" value="'+esc(p.bank)+'" style="font-weight:700" onchange="DB.settings.payments['+i+'].bank=this.value;persist()">'+
   '<input class="inp" value="'+esc(p.acct)+' · '+esc(p.holder)+'" style="margin-top:6px;font-size:12px" onchange="var v=this.value.split(\'·\');DB.settings.payments['+i+'].acct=(v[0]||\'\').trim();DB.settings.payments['+i+'].holder=(v[1]||\'\').trim();persist()"></div>'+
   '<label style="font-size:11px;font-weight:700"><input type="checkbox" '+(p.enabled?'checked':'')+' onchange="DB.settings.payments['+i+'].enabled=this.checked;persist()"> activo</label></div>';}).join('');}
function bioCount(v){var el=$('#bioCount');if(el)el.textContent=v.length;}
function pickLogo(inp){if(!inp.files||!inp.files[0])return;
 fileToDataURL(inp.files[0],256,true,function(d){DB.logo=d;persist();renderAdmin();toast('Logo actualizado ✔','good');});}
function saveProfile(){DB.name=$('#pfName').value.trim()||DB.name;DB.handle=slug($('#pfHandle').value)||DB.handle;
 DB.phone=$('#pfPhone').value.replace(/\D/g,'');DB.bio=$('#pfBio').value.slice(0,150);
 persist();renderAdmin();renderCatalog();toast('Perfil guardado ✔','good');}
function saveCfg(){var s=DB.settings;s.free_threshold=parseFloat($('#cfgFree').value)||0;s.low_stock=parseInt($('#cfgLow').value,10)||0;
 s.promo.min=parseFloat($('#cfgPMin').value)||0;s.promo.percent=parseFloat($('#cfgPPct').value)||0;
 persist();renderAdmin();toast('Configuración guardada ✔','good');}
function toggleCod(z){var i=DB.settings.cod_zones.indexOf(z);if(i===-1)DB.settings.cod_zones.push(z);else DB.settings.cod_zones.splice(i,1);persist();renderAdmin();toast('Zonas COD actualizadas','good');}
function simulateSale(){var av=DB.products.filter(function(p){return p.stock>0;});if(!av.length)return;var p=av[Math.floor(Math.random()*av.length)];p.stock--;persist();
 toast('⚡ Nueva venta: '+p.name+' −1'+(p.stock===0?' · ¡Agotado!':''),'warn');if(state.view==='admin')renderAdmin();renderCatalog();renderCartBadge();}
function resetDemo(){askConfirm('¿Restaurar la tienda demo y borrar los datos locales?',function(){LSdel('cy2-stores');LSdel('cy2-cart');LSdel('cy2-session');
 STORES={'s-demo':DEMO_STORE()};persistStores();cart=[];persistCart();setSession('s-demo');applyTheme(curTheme());renderCartBadge();show('tienda');toast('Demo restaurada','good');});}
/* init */
applyTheme(LSget('cy2-theme')||'dark');
if(loadSession()){enterApp();}else{show('auth');renderCartBadge();}
</script>
